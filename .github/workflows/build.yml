name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor loyihasini yaratish
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          cp index.html logo.png icon-192.png icon-512.png manifest.webmanifest www/
          npx cap init "Tradex AI" com.tradex.ai --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Ilova ikonkasi
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open("icon-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              for n in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  src.resize((s, s), Image.LANCZOS).save(f"{res}/mipmap-{d}/{n}")
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TradexAI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
