name: Signal Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - name: Scan markets every minute
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          WATCH: "XAUUSD,BTCUSD,ETHUSD"
          TFS: "M1,M5,M15"
          LOOP_MIN: "5"
        run: node scan.mjs
