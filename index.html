<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12"><title>Tradex AI</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b0e14;color:#e8ecf3;font-family:system-ui,sans-serif;max-width:560px;margin:auto;display:flex;flex-direction:column}
#splash{position:fixed;inset:0;background:#0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;transition:opacity .6s}
#splash img,#splash svg{width:96px;height:96px}#splash b{font-size:22px;letter-spacing:1px;color:#d8b45a}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222a38}
header span{font-weight:700;color:#d8b45a}header button{background:none;border:0;color:#7d889c;margin-left:12px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:11px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
.u{align-self:flex-end;background:#2a3142}.a{align-self:flex-start;background:#131823;width:92%}
h2{margin:6px 0 4px;font-size:26px}.mut{color:#7d889c;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#131823;border:1px solid #222a38;color:#e8ecf3;padding:9px 14px;border-radius:20px;font-size:14px}
.side{font-size:34px;font-weight:800}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.g small{display:block;color:#7d889c;font-size:12px}.g b{font-size:16px}
.w{color:#5c677b;font-size:11px;margin-top:8px}
footer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #222a38}
textarea{flex:1;resize:none;max-height:120px;padding:12px;border-radius:14px;border:0;background:#131823;color:#fff;font:inherit;font-size:16px}
#send{width:46px;border:0;border-radius:14px;background:#d8b45a;color:#0b0e14;font-size:20px;font-weight:700}#send:disabled{opacity:.4}
#set{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:8}
#set div{background:#131823;width:100%;max-width:560px;padding:20px;border-radius:20px 20px 0 0}
#set input{width:100%;padding:12px;margin:6px 0 14px;border-radius:10px;border:0;background:#0b0e14;color:#fff;font-size:16px}
#set button{width:100%;padding:14px;border:0;border-radius:10px;background:#d8b45a;font-weight:700}

body{background:#131313}#splash{background:#0b0b12}#splash img{width:120px;height:120px}#splash b{color:#c4b5fd;font-size:24px}
header{border:0;justify-content:flex-end}header button{color:#9a9a9a;font-size:14px}
#msgs.empty{justify-content:center;align-items:center;text-align:center}
.hl{width:96px;height:96px;margin-bottom:6px}.hi{font:400 38px Georgia,'Times New Roman',serif;margin:10px 0 14px}
.a{background:#1c1c1c}.u{background:#2b2b2b}
footer{border:0;padding-top:4px}.box{flex:1;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:26px;padding:12px 12px 10px 16px}
textarea{width:100%;background:none;padding:4px 0 10px;border-radius:0}.bar{display:flex;justify-content:space-between;align-items:center}
#send{width:42px;height:42px;border-radius:50%;background:#fff;color:#131313}
</style></head><body>
<div id="splash"><img src="logo.png" alt=""><b id="bn"></b></div>
<header><button id="clr">+ Yangi chat</button></header>
<div id="msgs"></div>
<footer><div class="box"><textarea id="inp" rows="1" placeholder="Message to Tradex AI"></textarea><div class="bar"><span class="mut">Tradex AI</span><button id="send">↑</button></div></div></footer>
<script>
const BRAND="Tradex AI";
const GEMINI_KEY="AQ.Ab8RN6JBJwPIXAnX60IIg-3-TJ77-skLJ16juIzoDkiFlJ119Q";   // <- Gemini kalitingizni shu qo'shtirnoq ichiga yozing
const TWELVE_KEY="616e969298944a03847b0ab9d7cf82db";   // <- ixtiyoriy: forex uchun twelvedata.com kaliti
const $=id=>document.getElementById(id);
$("bn").textContent=BRAND;
setTimeout(()=>{$("splash").style.opacity=0;setTimeout(()=>$("splash").remove(),600)},1800);
let K={g:GEMINI_KEY,t:TWELVE_KEY},hist=JSON.parse(localStorage.hist||"[]"),busy=false;
const CR={BTCUSD:"BTCUSDT",ETHUSD:"ETHUSDT",SOLUSD:"SOLUSDT",XRPUSD:"XRPUSDT",BNBUSD:"BNBUSDT",DOGEUSD:"DOGEUSDT",ADAUSD:"ADAUSDT"};
const TF={M1:["1m","1min"],M5:["5m","5min"],M15:["15m","15min"],M30:["30m","30min"],H1:["1h","1h"],H4:["4h","4h"],D1:["1d","1day"]};
const ROUTER=`Sen treyderlar uchun AI yordamchisan. Foydalanuvchi qaysi tilda yozsa, shu tilda (asosan o'zbekcha) qisqa javob ber.
Faqat JSON qaytar: {"type":"chat"|"signal","reply":"...","symbol":"...","tf":"..."}.
Foydalanuvchi signal/tahlil/kirish nuqtasi so'rasa type="signal". symbol quyidagilardan biri: XAUUSD,XAGUSD,BTCUSD,ETHUSD,SOLUSD,XRPUSD,BNBUSD,DOGEUSD,ADAUSD,EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,NZDUSD,EURJPY,GBPJPY,EURGBP (oltin=XAUUSD, bitkoin=BTCUSD). tf: M1,M5,M15,M30,H1,H4,D1 (aytilmasa M15). Boshqa hollarda type="chat" va reply to'ldir.`;
const ema=(v,n)=>{const k=2/(n+1),o=[v[0]];for(let i=1;i<v.length;i++)o.push(v[i]*k+o[i-1]*(1-k));return o};
function rsi(c,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=c[i]-c[i-1];g+=Math.max(d,0);l+=Math.max(-d,0)}g/=n;l/=n;
 for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}return l?100-100/(1+g/l):100}
async function candles(sym,tf){
 const [b,t]=TF[tf]||TF.M15;
 if(CR[sym]||(sym==="XAUUSD"&&!K.t)){
  const r=await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${CR[sym]||"PAXGUSDT"}&interval=${b}&limit=300`);
  if(!r.ok)throw new Error("Binance ma'lumot bermadi");
  return (await r.json()).map(x=>({o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));
 }
 if(!K.t)throw new Error("Forex va kumush uchun Sozlama'da TwelveData kalitini kiriting (twelvedata.com, bepul).");
 const r=await fetch(`https://api.twelvedata.com/time_series?symbol=${sym.slice(0,3)}/${sym.slice(3)}&interval=${t}&outputsize=300&apikey=${K.t}`);
 const j=await r.json();if(!j.values)throw new Error(j.message||"TwelveData xato");
 return j.values.reverse().map(x=>({o:+x.open,h:+x.high,l:+x.low,c:+x.close}));
}
function analyze(cs){
 const c=cs.map(x=>x.c),p=c.at(-1),n=cs.length;
 const tr=[];for(let i=1;i<n;i++)tr.push(Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-c[i-1]),Math.abs(cs[i].l-c[i-1])));
 const atr=tr.slice(-14).reduce((a,b)=>a+b)/14;
 const m=ema(c,12).map((v,i)=>v-ema(c,26)[i]),hist=m.at(-1)-ema(m,9).at(-1);
 const w=cs.slice(-100);let hi=0,lo=0;w.forEach((x,i)=>{if(x.h>w[hi].h)hi=i;if(x.l<w[lo].l)lo=i});
 const H=w[hi].h,L=w[lo].l,up=hi>lo,R=H-L,f={};
 [0.236,0.382,0.5,0.618,0.786].forEach(r=>f[r]=+(up?H-r*R:L+r*R).toFixed(5));
 const ext={1.272:up?H+0.272*R:L-0.272*R,1.618:up?H+0.618*R:L-0.618*R};
 return{price:p,atr,rsi:+rsi(c).toFixed(1),macdHist:hist,ema20:ema(c,20).at(-1),ema50:ema(c,50).at(-1),ema200:ema(c,200).at(-1),
  swing:{dir:up?"yuqoriga impuls (pullback BUY zonasi 0.5-0.618)":"pastga impuls (pullback SELL zonasi 0.5-0.618)",high:H,low:L},fib:f,ext,last20:c.slice(-20)};
}
const SIG=`Sen professional treyder-analitiksan. Berilgan hisoblangan ma'lumotlar (trend, RSI, MACD, ATR, Fibonacci) asosida bitta aniq setup tanla.
Qoidalar: trend yo'nalishida va Fibonacci 0.5-0.618 zonasi yoki support/resistance yaqinida kir; SL swing yoki 1.5*ATR dan narida; TP1 kamida 1:1.5, TP2 kamida 1:2.5 (1.272/1.618 kengaytma ishlatish mumkin); entry narx 2*ATR dan uzoq bo'lmasin. Signallar aralash bo'lsa side="WAIT".
Faqat JSON: {"side":"BUY"|"SELL"|"WAIT","entry":n,"sl":n,"tp1":n,"tp2":n,"confidence":0-100,"text":"2-3 gap o'zbekcha izoh: nega shu nuqta"}`;
async function gem(system,contents){
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${K.g}`,{method:"POST",headers:{"content-type":"application/json"},
  body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{responseMimeType:"application/json",temperature:0.2}})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"Gemini xato");
 return JSON.parse(j.candidates[0].content.parts[0].text);
}
function svg(cs,lines){
 const d=cs.slice(-70),W=420,H=240,vals=[...d.flatMap(x=>[x.h,x.l]),...lines.map(l=>l.v)];
 const mn=Math.min(...vals),mx=Math.max(...vals),y=v=>H-(v-mn)/(mx-mn||1)*H,bw=W/d.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 lines.forEach(l=>s+=`<line x1="0" x2="${W}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-dasharray="${l.d?3:0}" opacity=".8"/><text x="3" y="${y(l.v)-2}" font-size="9" fill="${l.c}">${l.t}</text>`);
 d.forEach((x,i)=>{const c=x.c>=x.o?"#2ebd85":"#f6465d",cx=i*bw+bw/2;
  s+=`<line x1="${cx}" x2="${cx}" y1="${y(x.h)}" y2="${y(x.l)}" stroke="${c}"/><rect x="${cx-bw*.35}" y="${y(Math.max(x.o,x.c))}" width="${bw*.7}" height="${Math.max(1,Math.abs(y(x.o)-y(x.c)))}" fill="${c}"/>`});
 return s+"</svg>";
}
function add(cls,html){const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;$("msgs").appendChild(d);$("msgs").scrollTop=1e9;return d}
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function home(){const M=$("msgs");M.innerHTML="";M.classList.toggle("empty",!hist.length);
 if(!hist.length){M.innerHTML=`<img src="logo.png" class="hl"><h1 class="hi">Hello, Trader!</h1><div class="chips" style="justify-content:center">${["XAUUSD M1 signal","Bitcoin M15 signal","EURUSD H1 tahlil","Fibonacci nima?"].map(t=>`<button class="chip">${t}</button>`).join("")}</div>`;
  M.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("inp").value=b.textContent;send()});return}
 hist.forEach(h=>add(h.role==="user"?"u":"a",esc(h.parts[0].text)));}
async function send(){
 const t=$("inp").value.trim();if(!t||busy)return;
 if(!K.g){add("a","GEMINI_KEY kodga yozilmagan. index.html ichida kalitni kiriting.");return}
 busy=true;$("send").disabled=true;$("inp").value="";if($("msgs").classList.contains("empty")){$("msgs").innerHTML="";$("msgs").classList.remove("empty")}add("u",esc(t));
 hist.push({role:"user",parts:[{text:t}]});const w=add("a","Tahlil qilinmoqda...");
 try{
  const r=await gem(ROUTER,hist.slice(-10));
  if(r.type!=="signal"){w.textContent=r.reply;hist.push({role:"model",parts:[{text:r.reply}]})}
  else{
   const sym=r.symbol,tf=r.tf||"M15",cs=await candles(sym,tf),a=analyze(cs);
   const d=await gem(SIG,[{role:"user",parts:[{text:JSON.stringify({symbol:sym,tf,...a})}]}]);
   const n=[d.entry,d.sl,d.tp1,d.tp2],B=d.side==="BUY";
   const good=d.side==="WAIT"||(n.every(Number.isFinite)&&Math.abs(d.entry-a.price)<=2*a.atr&&(B?d.sl<d.entry&&d.entry<d.tp1&&d.tp1<=d.tp2:d.sl>d.entry&&d.entry>d.tp1&&d.tp1>=d.tp2));
   const dp=a.price<10?5:2,f=v=>Number(v).toFixed(dp);
   if(!good||d.side==="WAIT"){w.innerHTML=`<div class="side" style="color:#d8b45a">KUTISH</div><div class="mut">${sym} · ${tf}</div><p>${esc(good?d.text:"Aniq va xavfsiz setup topilmadi. Bozor aralash, keyinroq qayta so'rang.")}</p>${svg(cs,Object.entries(a.fib).map(([k,v])=>({v,t:k,c:"#7d889c",d:1})))}`}
   else{
    const col=B?"#2ebd85":"#f6465d",rr=(Math.abs(d.tp2-d.entry)/Math.abs(d.entry-d.sl)).toFixed(1);
    const L=[...Object.entries(a.fib).map(([k,v])=>({v,t:"Fib "+k,c:"#7d889c",d:1})),{v:d.entry,t:"ENTRY",c:"#e8ecf3"},{v:d.sl,t:"SL",c:"#f6465d"},{v:d.tp1,t:"TP1",c:"#2ebd85"},{v:d.tp2,t:"TP2",c:"#2ebd85"}];
    const c=(l,v,k="#e8ecf3")=>`<div><small>${l}</small><b style="color:${k}">${v}</b></div>`;
    w.innerHTML=`<div class="side" style="color:${col}">${d.side}</div><div class="mut">${sym} · ${tf} · ishonch ${d.confidence}%</div>${svg(cs,L)}<div class="g">${c("Kirish",f(d.entry))}${c("SL",f(d.sl),"#f6465d")}${c("TP1",f(d.tp1),"#2ebd85")}${c("TP2",f(d.tp2),"#2ebd85")}${c("Risk/Foyda","1:"+rr)}${c("RSI",a.rsi)}</div><div>${esc(d.text)}</div><div class="w">Moliyaviy maslahat emas. Har doim SL ishlating.</div>`;
   }
   hist.push({role:"model",parts:[{text:`${sym} ${tf} signal: ${d.side} ${d.entry||""}`}]});
  }
 }catch(e){w.textContent="Xato: "+e.message;hist.pop()}
 localStorage.hist=JSON.stringify(hist.slice(-20));busy=false;$("send").disabled=false;$("msgs").scrollTop=1e9;
}
$("send").onclick=send;
$("clr").onclick=()=>{hist=[];localStorage.hist="[]";home()};
home();
</script></body></html>
